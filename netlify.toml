[build]
  command = "npm run build"
  publish = "dist"

# This app is a client-side-routed SPA (react-router BrowserRouter, e.g. /ko/about,
# /classroom, /admin/accounts). Without this rule, Netlify's static host would 404 on
# any direct visit or refresh of those paths — only "/" resolves to a real file. This
# rule sends every request to index.html so react-router can take over routing in the
# browser, matching how `vite dev`/`vite preview` already behave locally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
